<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Pack drawings used in the hero shelf, product cards and quick view.
    Colours come from CSS custom properties set on the svg that uses them
    (pk-band, pk-veg, pk-glass, pk-lid, pk-tin, pk-white, pk-kraft, pk-drum, pk-frost).
    Outlines use currentColor. Note: two hyphens in a row are not allowed inside XML comments.
  -->
  <symbol id="jar-s" viewBox="0 0 56 84">
    <g stroke="currentColor" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke">
      <rect x="11" y="2" width="34" height="10" rx="2" style="fill:var(--pk-lid,#8E7442)"/>
      <rect x="13" y="12" width="30" height="5" style="fill:var(--pk-glass,#EEF3EA)"/>
      <rect x="4" y="16" width="48" height="66" rx="9" style="fill:var(--pk-glass,#EEF3EA)"/>
    </g>
    <rect x="8" y="27" width="40" height="51" rx="6" style="fill:var(--pk-veg,#8C9A5E)"/>
    <rect x="4" y="40" width="48" height="24" stroke="currentColor" stroke-width="2" style="fill:var(--pk-band,#C7A872)"/>
    <rect x="15" y="49" width="26" height="3" fill="currentColor" opacity=".55"/>
    <rect x="19" y="55" width="18" height="2" fill="currentColor" opacity=".35"/>
  </symbol>

  <symbol id="jar-l" viewBox="0 0 64 120">
    <g stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <rect x="12" y="2" width="40" height="11" rx="2" style="fill:var(--pk-lid,#8E7442)"/>
      <rect x="14" y="13" width="36" height="5" style="fill:var(--pk-glass,#EEF3EA)"/>
      <rect x="4" y="17" width="56" height="101" rx="10" style="fill:var(--pk-glass,#EEF3EA)"/>
    </g>
    <rect x="8" y="30" width="48" height="84" rx="7" style="fill:var(--pk-veg,#8C9A5E)"/>
    <rect x="4" y="54" width="56" height="34" stroke="currentColor" stroke-width="2" style="fill:var(--pk-band,#C7A872)"/>
    <rect x="16" y="66" width="32" height="3" fill="currentColor" opacity=".55"/>
    <rect x="21" y="73" width="22" height="2" fill="currentColor" opacity=".35"/>
  </symbol>

  <symbol id="pouch" viewBox="0 0 84 120">
    <path d="M9 12 H75 L73 98 Q78 116 68 118 H16 Q6 116 11 98 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="fill:var(--pk-band,#C7A872)"/>
    <rect x="9" y="4" width="66" height="10" stroke="currentColor" stroke-width="2" style="fill:var(--pk-band,#C7A872)"/>
    <path d="M12 22 H72" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <ellipse cx="42" cy="72" rx="20" ry="24" stroke="currentColor" stroke-width="2" style="fill:var(--pk-veg,#8C9A5E)"/>
    <rect x="24" y="34" width="36" height="3" fill="currentColor" opacity=".55"/>
  </symbol>

  <symbol id="tin" viewBox="0 0 104 124">
    <g stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <rect x="6" y="8" width="92" height="108" style="fill:var(--pk-tin,#BFC4BB)"/>
      <rect x="6" y="16" width="92" height="92" style="fill:var(--pk-band,#C7A872)"/>
      <rect x="2" y="3" width="100" height="9" rx="3" style="fill:var(--pk-tin,#BFC4BB)"/>
      <rect x="2" y="112" width="100" height="9" rx="3" style="fill:var(--pk-tin,#BFC4BB)"/>
    </g>
    <circle cx="52" cy="58" r="20" stroke="currentColor" stroke-width="2" style="fill:var(--pk-veg,#8C9A5E)"/>
    <rect x="26" y="88" width="52" height="3" fill="currentColor" opacity=".55"/>
    <rect x="34" y="95" width="36" height="2" fill="currentColor" opacity=".35"/>
  </symbol>

  <symbol id="pail" viewBox="0 0 124 140">
    <path d="M18 32 Q62 -4 106 32" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <g stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M12 34 H112 L104 136 H20 Z" style="fill:var(--pk-white,#FAFAF6)"/>
      <rect x="6" y="24" width="112" height="13" rx="3" style="fill:var(--pk-white,#FAFAF6)"/>
      <path d="M17 60 H107 L103 110 H21 Z" style="fill:var(--pk-band,#C7A872)"/>
    </g>
    <circle cx="62" cy="80" r="13" stroke="currentColor" stroke-width="2" style="fill:var(--pk-veg,#8C9A5E)"/>
    <rect x="40" y="99" width="44" height="3" fill="currentColor" opacity=".55"/>
  </symbol>

  <symbol id="carton" viewBox="0 0 160 112">
    <g stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M4 26 L34 6 H156 L126 26 Z" style="fill:var(--pk-kraft-2,#D6BC93)"/>
      <path d="M126 26 L156 6 V88 L126 108 Z" style="fill:var(--pk-kraft-3,#A9875A)"/>
      <rect x="4" y="26" width="122" height="82" style="fill:var(--pk-kraft,#C2A276)"/>
      <rect x="18" y="46" width="94" height="42" style="fill:var(--pk-frost,#D9E8EC)"/>
    </g>
    <path d="M60 6 L30 26" stroke="currentColor" stroke-width="1.5" opacity=".5"/>
    <g stroke="currentColor" stroke-width="2" stroke-linecap="round" transform="translate(40 67)">
      <path d="M0 -11 V11 M-9.5 -5.5 L9.5 5.5 M-9.5 5.5 L9.5 -5.5"/>
    </g>
    <rect x="58" y="60" width="42" height="3" fill="currentColor" opacity=".55"/>
    <rect x="58" y="68" width="30" height="2" fill="currentColor" opacity=".35"/>
  </symbol>

  <symbol id="drum" viewBox="0 0 110 160">
    <g stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <rect x="8" y="8" width="94" height="148" rx="10" style="fill:var(--pk-drum,#3E6B78)"/>
      <rect x="4" y="3" width="102" height="10" rx="4" style="fill:var(--pk-drum,#3E6B78)"/>
      <rect x="24" y="62" width="62" height="40" style="fill:var(--pk-band,#C7A872)"/>
    </g>
    <path d="M8 46 H102 M8 120 H102" stroke="currentColor" stroke-width="2"/>
    <rect x="34" y="76" width="42" height="3" fill="currentColor" opacity=".6"/>
    <rect x="40" y="84" width="30" height="2" fill="currentColor" opacity=".4"/>
  </symbol>
</svg>
